<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/million-game/">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="million_game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>million_game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.playCorrectSound = function() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var notes = [[523.25,0],[659.25,.13],[783.99,.26],[1046.5,.39]];
        notes.forEach(function(n) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = n[0];
          gain.gain.setValueAtTime(0.45, ctx.currentTime + n[1]);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n[1] + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + n[1]);
          osc.stop(ctx.currentTime + n[1] + 0.28);
        });
      } catch(e) {}
    };

    window.playWrongSound = function() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var steps = [[260,0],[220,.18],[170,.36]];
        steps.forEach(function(s) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = s[0];
          gain.gain.setValueAtTime(0.35, ctx.currentTime + s[1]);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + s[1] + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + s[1]);
          osc.stop(ctx.currentTime + s[1] + 0.22);
        });
      } catch(e) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
